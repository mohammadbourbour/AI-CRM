services:
  backend:
    build:
      context: ./backend
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      DATABASE_URL: sqlite:////app/data/crm.db
    volumes:
      - ./data:/app/data
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')",
        ]
      interval: 5s
      timeout: 3s
      retries: 12

  n8n:
    image: n8nio/n8n:latest
    ports:
      - "${N8N_PORT_HOST:-5678}:5678"
    environment:
      N8N_HOST: localhost
      N8N_PORT: 5678
      N8N_PROTOCOL: http
      WEBHOOK_URL: http://localhost:5678/
      GENERIC_TIMEZONE: UTC
      BACKEND_BASE_URL: http://backend:8000
      WEBHOOK_SECRET: ${WEBHOOK_SECRET:-dev-webhook-secret-change-me}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4o-mini}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-2.0-flash}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID:-}
      N8N_TELEGRAM_ALERTS: ${N8N_TELEGRAM_ALERTS:-false}
      N8N_BLOCK_ENV_ACCESS_IN_NODE: false
      N8N_EXPRESSIONS_ALLOWED_ENV_VARS: BACKEND_BASE_URL,WEBHOOK_SECRET,OPENAI_API_KEY,OPENAI_MODEL,GEMINI_API_KEY,GEMINI_MODEL,TELEGRAM_BOT_TOKEN,TELEGRAM_CHAT_ID,N8N_TELEGRAM_ALERTS,WHATSAPP_TOKEN,WHATSAPP_PHONE_NUMBER_ID,WHATSAPP_TO,RESEND_API_KEY,EMAIL_FROM,GOOGLE_SHEETS_SPREADSHEET_ID,GOOGLE_SHEETS_WORKSHEET
      WHATSAPP_TOKEN: ${WHATSAPP_TOKEN:-}
      WHATSAPP_PHONE_NUMBER_ID: ${WHATSAPP_PHONE_NUMBER_ID:-}
      WHATSAPP_TO: ${WHATSAPP_TO:-}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      EMAIL_FROM: ${EMAIL_FROM:-}
      GOOGLE_SHEETS_SPREADSHEET_ID: ${GOOGLE_SHEETS_SPREADSHEET_ID:-}
      GOOGLE_SHEETS_WORKSHEET: ${GOOGLE_SHEETS_WORKSHEET:-Qualified Leads}
    volumes:
      - n8n_data:/home/node/.n8n
    depends_on:
      backend:
        condition: service_healthy

volumes:
  n8n_data:
